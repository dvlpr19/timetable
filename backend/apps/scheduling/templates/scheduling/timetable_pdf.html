<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<title>{{ t.title }}</title>
<style>
  @page { size: A4 landscape; margin: 14mm 12mm; }
  body { font-family: "DejaVu Sans", sans-serif; font-size: 8.5pt; color: #14201C; }
  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8mm; }
  .academy { font-weight: 700; font-size: 10pt; color: #073D31; }
  h1 { font-size: 15pt; margin: 2mm 0 1mm; }
  .sub { color: #5B6863; }
  .sign { text-align: right; width: 70mm; }
  .sign .line { margin-top: 10mm; border-top: 0.6pt solid #14201C; padding-top: 1mm; color: #5B6863; font-size: 7.5pt; text-align: center; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { background: #0B5D4B; color: #fff; font-weight: 700; padding: 2mm; white-space: pre-line; }
  td { border: 0.5pt solid #E1E5DF; padding: 1.6mm; vertical-align: top; white-space: pre-line; }
  td:first-child { font-weight: 700; width: 24mm; background: #EEF1EC; }
  td.closed { background: #EEF1EC; color: #5B6863; font-style: italic; text-align: center; vertical-align: middle; }
  tr { page-break-inside: avoid; }
  footer { margin-top: 4mm; color: #5B6863; font-size: 7pt; }
</style>
</head>
<body>
<header>
  <div>
    <div class="academy">{{ t.academy }}</div>
    <h1>{{ t.title }}</h1>
    <div class="sub">{{ t.subtitle }}</div>
  </div>
  <div class="sign">{{ signature }}<div class="line">{{ signature_line }}</div></div>
</header>
<table>
  <thead><tr>{% for c in t.columns %}<th>{{ c }}</th>{% endfor %}</tr></thead>
  <tbody>
  {% for row in rows %}<tr>{% for cell in row %}<td{% if cell.closed %} class="closed"{% endif %}>{{ cell.text }}</td>{% endfor %}</tr>{% endfor %}
  </tbody>
</table>
<footer>{{ generated }}</footer>
</body>
</html>
